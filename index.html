<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Danta live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Danta live — le logo vivant réagit au vrai son (onglet Spotify, son du Mac ou micro). Plein écran, sombre. */
:root{--bg:#060708;--panel:#0f1115;--raise:#161920;--line:#21252e;--line2:#2c313c;--ink:#eef1f5;--mute:#7c8594;--a:#3df5a6;--b:#59d8ff;
  --f-brand:"Unbounded","Segoe UI",system-ui,sans-serif;--f-ui:"Geist",system-ui,sans-serif;--f-mono:"Geist Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 45%,#0d1216,var(--bg) 60%);color:var(--ink);font:14px/1.5 var(--f-ui);overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;gap:12px;padding:16px max(18px,env(safe-area-inset-left));transition:opacity .4s}
header b{font:700 16px/1 var(--f-brand)} header b span{display:block;font:500 9px/1.7 var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.state{margin-left:auto;font:12px var(--f-mono);color:var(--mute);display:flex;align-items:center;gap:8px}
.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:12.5px var(--f-ui);color:var(--mute);background:rgba(15,17,21,.85);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:92vw;text-align:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)} .dot.on{background:var(--a);box-shadow:0 0 12px var(--a)}
main{display:grid;place-items:center;position:relative;min-height:0}
canvas#logo{width:min(70vmin,640px);height:min(70vmin,640px)}
.glow{position:absolute;width:min(60vmin,520px);height:min(60vmin,520px);border-radius:50%;background:radial-gradient(closest-side,rgba(61,245,166,.18),transparent);filter:blur(10px);pointer-events:none;transition:transform .08s}
.start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,7,8,.72);backdrop-filter:blur(6px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:min(520px,92vw);display:grid;gap:12px}
.card h1{font:700 18px/1.2 var(--f-brand);margin:0}
.card p{margin:0;color:var(--mute);font-size:13.5px}
.src{display:grid;grid-template-columns:34px 1fr;gap:4px 12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);cursor:pointer;font:inherit}
.src:hover{border-color:var(--a)}
.src i{grid-row:span 2;font-style:normal;font-size:20px;text-align:center}
.src b{font-weight:600} .src small{color:var(--mute);font-size:12px}
.err{color:#ff7a8a;font-size:13px;min-height:1em}
footer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px max(18px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(15,17,21,.7);transition:opacity .4s}
footer label{display:flex;align-items:center;gap:8px;font:11.5px var(--f-mono);color:var(--mute)}
footer input{accent-color:var(--a);width:110px}
.meters{display:flex;gap:10px;align-items:center;font:10.5px var(--f-mono);color:var(--mute)}
.meters div{display:flex;align-items:center;gap:5px}.meters span{display:block;width:44px;height:5px;border-radius:9px;background:var(--line2);overflow:hidden}
.meters span i{display:block;height:100%;width:0;background:var(--a)}
.btn{margin-left:auto;font:600 12.5px var(--f-ui);background:var(--raise);color:var(--ink);border:1px solid var(--line2);border-radius:8px;height:30px;padding:0 12px;cursor:pointer}
body.idle header,body.idle footer{opacity:0}
</style>
</head>
<body>
<header><canvas id="mini" width="28" height="28" style="width:28px;height:28px"></canvas><b>Danta<span>live</span></b>
  <div class="state"><span class="dot" id="dot"></span><span id="state">en attente du son</span></div></header>
<main>
  <div class="glow" id="glow"></div>
  <canvas id="logo"></canvas>
  <div class="hint" id="hint" hidden></div>
  <div class="start" id="start">
    <div class="card">
      <h1>Brancher le son</h1>
      <p>Choisis ce que Danta live doit écouter. Rien n'est enregistré ni envoyé : le son est analysé sur place, dans cette page.</p>
      <button class="src" data-src="tab"><i>🎧</i><b>Onglet Spotify (Chrome)</b><small>Ouvre open.spotify.com dans un onglet, choisis-le et coche « Partager aussi l'audio de l'onglet ». Le plus fidèle.</small></button>
      <button class="src" data-src="screen"><i>🖥️</i><b>Son du Mac (app Spotify)</b><small>Choisis « Écran entier » et active « Partager l'audio du système ». Demande un macOS et un Chrome récents.</small></button>
      <button class="src" data-src="mic"><i>🎙️</i><b>Micro</b><small>Écoute ce qui sort des enceintes. Marche partout (même musique sur l'iPhone), mais capte aussi la pièce.</small></button>
      <div class="err" id="err"></div>
    </div>
  </div>
</main>
<footer>
  <label for="gain">Sensibilité <input id="gain" type="range" min="0.4" max="3" step="0.05" value="1.2"></label>
  <label for="rays">Rayons <input id="rays" type="range" min="8" max="28" step="2" value="16"></label>
  <div class="meters"><div>basses<span><i id="m-low"></i></span></div><div>médiums<span><i id="m-mid"></i></span></div><div>aigus<span><i id="m-high"></i></span></div></div>
  <button class="btn" id="change">Changer de source</button>
  <button class="btn" id="fs" style="margin-left:0">Plein écran</button>
</footer>

<script>
const TAU = Math.PI*2, A = "#3df5a6", B = "#59d8ff";
const $ = s => document.querySelector(s);
const P = { gain:1.2, rays:16 };
let analyser = null, freq = null, ctxAudio = null, stream = null;

/* ---------- 1. Entrée audio ---------- */
async function connect(kind){
  $("#err").textContent = "";
  // Le module audio doit être créé PENDANT le clic : créé après une attente, Chrome le démarre en pause (= silence).
  stop();
  ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  ctxAudio.resume().catch(() => {});
  const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
  try {
    if (kind !== "mic" && isSafari) throw new Error("Safari ne sait pas partager le son d'un onglet ou de l'écran : ouvre cette page dans Google Chrome, ou choisis « Micro ».");
    if (kind !== "mic" && !navigator.mediaDevices?.getDisplayMedia) throw new Error("Ce navigateur ne permet pas de partager le son : utilise Google Chrome, ou choisis « Micro ».");
    if (kind === "mic"){
      stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
    } else {
      const opts = { video:true, audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false },
        selfBrowserSurface:"exclude", systemAudio:"include", surfaceSwitching:"include", monitorTypeSurfaces: kind==="screen" ? "include" : "exclude" };
      try { stream = await navigator.mediaDevices.getDisplayMedia(opts); }
      catch(e){ if (e.name === "TypeError") stream = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true }); else throw e; }
      stream.getVideoTracks().forEach(t => t.stop());           // seule la piste son nous intéresse
      if (!stream.getAudioTracks().length){ stop(); throw new Error(kind==="tab" ? "Aucun son reçu : coche « Partager aussi l'audio de l'onglet » au moment du partage." : "Aucun son reçu : active « Partager l'audio du système », ou utilise l'onglet Spotify / le micro."); }
    }
    if (ctxAudio.state !== "running") await ctxAudio.resume().catch(() => {});
    const src = ctxAudio.createMediaStreamSource(stream);
    analyser = ctxAudio.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = .55;
    src.connect(analyser);                                         // pas de sortie : on n'entend pas le son en double
    freq = new Uint8Array(analyser.frequencyBinCount);
    stream.getAudioTracks()[0].addEventListener("ended", () => { stop(); $("#start").hidden = false; });
    $("#start").hidden = true; $("#dot").classList.add("on");
    $("#state").dataset.label = kind === "mic" ? "micro · à l'écoute" : kind === "tab" ? "onglet partagé · à l'écoute" : "son du Mac · à l'écoute";
    $("#state").textContent = $("#state").dataset.label;
    try { localStorage.setItem("dl-src", kind); } catch {}
    D.heard = 0; D.since = performance.now();
  } catch(e){
    stop();
    $("#err").textContent = e.name === "NotAllowedError" ? (kind === "mic" ? "Accès au micro refusé : autorise-le dans la barre d'adresse de Chrome (icône 🎙️), puis réessaie." : "Partage refusé. Réessaie et accepte la demande du navigateur.")
      : e.name === "NotFoundError" ? "Aucun micro trouvé sur cet appareil." : (e.message || String(e));
  }
}
function stop(){ if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; if (ctxAudio) ctxAudio.close(); ctxAudio = null; analyser = null; $("#dot").classList.remove("on"); $("#state").textContent = "en attente du son"; }
document.querySelectorAll(".src").forEach(b => b.addEventListener("click", () => connect(b.dataset.src)));
$("#change").addEventListener("click", () => { stop(); $("#start").hidden = false; });
$("#fs").addEventListener("click", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(()=>{}));
$("#gain").addEventListener("input", e => P.gain = +e.target.value);
$("#rays").addEventListener("input", e => { P.rays = +e.target.value; logos.forEach(o => o.rays = []); });

/* ---------- 2. Analyse : 24 bandes + détection des coups ---------- */
const bands = new Float32Array(24);
const D = { low:0, mid:0, high:0, lowAvg:.05, midAvg:.05, highAvg:.05, lastK:0, lastS:0, lastH:0, energy:0, kick:0 };
const hits = [];
function bandRange(f0, f1){ if (!analyser) return 0; const hz = ctxAudio.sampleRate/2/freq.length; let s = 0, n = 0;
  for (let i = Math.max(1, Math.floor(f0/hz)); i <= Math.min(freq.length-1, Math.ceil(f1/hz)); i++){ s += freq[i]; n++; } return n ? s/n/255 : 0; }
function analyse(now){
  if (!analyser){ for (let i=0;i<24;i++) bands[i] *= .9; D.energy *= .9; return; }
  if (ctxAudio && ctxAudio.state === "suspended") ctxAudio.resume().catch(() => {});
  analyser.getByteFrequencyData(freq);
  let peak = 0; for (let i = 0; i < freq.length; i += 8) peak = Math.max(peak, freq[i]);
  if (peak > 12){ D.heard = now; }
  const silent = now - Math.max(D.heard || 0, D.since || 0) > 2500;
  $("#state").textContent = silent ? "connecté, mais aucun son reçu" : $("#state").dataset.label;
  const h = $("#hint"); h.hidden = !silent;
  if (silent) h.textContent = "Aucun son reçu. Vérifie que la musique joue, que tu as bien coché le partage de l'audio, ou monte la sensibilité. Avec le micro, rapproche-toi des enceintes.";
  const g = P.gain;
  for (let i=0;i<24;i++){ const f0 = 30*Math.pow(16000/30, i/24), f1 = 30*Math.pow(16000/30, (i+1)/24);
    const v = Math.min(1, Math.pow(bandRange(f0,f1), 1.4) * 1.8 * g); bands[i] += (v - bands[i]) * (v > bands[i] ? .6 : .18); }
  D.low = bandRange(35,140)*g; D.mid = bandRange(180,2200)*g; D.high = bandRange(5000,12000)*g*1.6;
  const fire = (key, lastKey, avgKey, minGap, thr, type) => {
    const v = D[key], avg = D[avgKey];
    if (v > avg*1.32 && v > thr && now - D[lastKey] > minGap){ D[lastKey] = now; hits.push({ type, vel: Math.min(1.4, v/(avg+.02)*.55) }); }
    D[avgKey] += (v - avg) * .06;
  };
  fire("low","lastK","lowAvg", 180, .18, "kick"); fire("mid","lastS","midAvg", 160, .14, "snare"); fire("high","lastH","highAvg", 90, .08, "hat");
  D.energy += (Math.min(1,(D.low*.6 + D.mid*.5 + D.high*.3)) - D.energy) * .2;
  $("#m-low").style.width = Math.min(100, D.low*100)+"%"; $("#m-mid").style.width = Math.min(100, D.mid*100)+"%"; $("#m-high").style.width = Math.min(100, D.high*100)+"%";
}

/* ---------- 3. Logo : gouttes liquides en relief ---------- */
const dpr = Math.min(2, devicePixelRatio || 1);
function makeLogo(cv, size){ const o = { cv, ctx: cv.getContext("2d"), w:size, rays:[] }; resize(o); return o; }
function resize(o){ const w = o.cv.clientWidth || o.w; o.w = w; o.cv.width = w*dpr; o.cv.height = w*dpr; o.ctx.setTransform(dpr,0,0,dpr,0,0); }
const logos = [makeLogo($("#logo"), 560), makeLogo($("#mini"), 28)];
addEventListener("resize", () => resize(logos[0]));
function ensure(o){ const n = o.w < 40 ? 12 : P.rays; if (o.rays.length !== n) o.rays = Array.from({length:n}, () => ({ h:0, v:0, neck:1 })); }
function push(o, i, amt){ const r = o.rays[((i % o.rays.length)+o.rays.length)%o.rays.length]; r.v = r.h > .5 ? Math.max(r.v,0) + amt*.25 : Math.max(r.v, amt); r.neck = 1; }
function onHit(h){ logos.forEach(o => { ensure(o); const n = o.rays.length, F = o.w*h.vel;
  if (h.type === "kick"){ for (let i=0;i<n;i++) if (Math.random() < .45) push(o, i, F*(.006 + .006*Math.random())); D.kick = Math.min(1.2, h.vel); }
  if (h.type === "snare"){ for (let i=0;i<n;i++) if (Math.random() < .3) push(o, i, F*.008); }
  if (h.type === "hat" && Math.random() < .6) push(o, Math.floor(Math.random()*n), F*.0032); }); }
function draw(o, now){
  ensure(o); const { ctx, w } = o, n = o.rays.length, c = w/2, small = w < 40, tilt = .62, G = w*.0009, maxH = w*.12;
  o.rays.forEach(r => { if (!isFinite(r.h)) { r.h = 0; r.v = 0; } r.v -= G; r.h += r.v; if (r.h > maxH){ r.h = maxH; r.v = Math.min(r.v,0); }
    if (r.h <= 0){ r.h = 0; r.v = Math.abs(r.v) > G*3 ? -r.v*.3 : 0; } r.neck = r.h > w*.07 ? Math.max(0, r.neck - .25) : Math.min(1, r.neck + .08); });
  ctx.clearRect(0,0,w,w); ctx.lineCap = "round";
  const rot = now/7000, items = o.rays.map((r,i) => { const a = -Math.PI/2 + i/n*TAU + rot; return { r, i, a, dz: Math.sin(a) }; }).sort((p,q) => p.dz - q.dz);
  items.forEach(({ r, i, a, dz }) => {
    const s = .78 + .22*(dz+1)/2, cos = Math.cos(a), sin = Math.sin(a), Y = v => c + v*tilt;
    const band = bands[Math.round(Math.abs(n/2 - i)/(n/2) * 22)];
    const r0 = w*.15, L = w*(.2 + .1*band) + w*.02*D.energy, rest = L + w*.06;
    const tip = [c + cos*L, Y(sin*L)], drop = [c + cos*rest, Y(sin*rest) - r.h];
    ctx.globalAlpha = .45 + .55*(dz+1)/2;
    ctx.strokeStyle = B; ctx.lineWidth = Math.max(1.6, w*.03)*s; ctx.beginPath(); ctx.moveTo(c + cos*r0, Y(sin*r0)); ctx.lineTo(...tip); ctx.stroke();
    const dr = Math.max(1.8, w*(.024 + .012*band))*s;
    if (r.neck > .02 && r.h > w*.004){
      const dx = drop[0]-tip[0], dy = drop[1]-tip[1], d = Math.hypot(dx,dy) || 1, nx = -dy/d, ny = dx/d;
      const wb = Math.max(.8, w*.016)*s, wd = dr*.8*r.neck, wm = Math.max(.25, wb*.4*r.neck*(1 - Math.min(.9, r.h/(w*.09)))), m = [(tip[0]+drop[0])/2, (tip[1]+drop[1])/2];
      ctx.fillStyle = A; ctx.beginPath(); ctx.moveTo(tip[0]+nx*wb, tip[1]+ny*wb);
      ctx.quadraticCurveTo(m[0]+nx*wm, m[1]+ny*wm, drop[0]+nx*wd, drop[1]+ny*wd); ctx.lineTo(drop[0]-nx*wd, drop[1]-ny*wd);
      ctx.quadraticCurveTo(m[0]-nx*wm, m[1]-ny*wm, tip[0]-nx*wb, tip[1]-ny*wb); ctx.closePath(); ctx.fill();
    }
    if (!small){ ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.beginPath(); ctx.ellipse(drop[0], Y(sin*rest) + w*.012, dr*(1 - Math.min(.6, r.h/w*2)), dr*.38, 0, 0, TAU); ctx.fill(); }
    const g = ctx.createRadialGradient(drop[0]-dr*.35, drop[1]-dr*.35, dr*.1, drop[0], drop[1], dr);
    g.addColorStop(0, "#d9fff0"); g.addColorStop(.4, A); g.addColorStop(1, "#0b4f3a");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(drop[0], drop[1], dr, 0, TAU); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* ---------- 4. Boucle ---------- */
function frame(now){
  requestAnimationFrame(frame);
  try { analyse(now); while (hits.length) onHit(hits.shift()); D.kick *= .88;
    logos.forEach(o => draw(o, now)); $("#glow").style.transform = `scale(${1 + .12*D.kick + .08*D.energy})`; } catch(e){ logos.forEach(o => o.rays = []); }
}
requestAnimationFrame(frame);

/* interface qui s'efface quand on ne bouge pas la souris */
let idleT; const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => analyser && document.body.classList.add("idle"), 3500); };
["mousemove","keydown","touchstart"].forEach(ev => addEventListener(ev, wake)); wake();
addEventListener("keydown", e => { if (e.key === "f") $("#fs").click(); });
</script>
</body>
</html>
