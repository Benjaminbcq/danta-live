<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Danta live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Danta live — la musique devient une membrane vivante. Plein écran, sombre, HUD discret qui s'efface. */
:root{--bg:#050607;--panel:rgba(15,17,21,.82);--raise:#161920;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--ink:#eef1f5;--mute:#8a93a1;--a:#3df5a6;--b:#59d8ff;
  --f-brand:"Unbounded","Segoe UI",system-ui,sans-serif;--f-ui:"Geist",system-ui,sans-serif;--f-mono:"Geist Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;display:flex;align-items:center;gap:12px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));transition:opacity .6s;z-index:2;pointer-events:none}
.hud > *{pointer-events:auto}
.top{top:0;padding-top:calc(14px + env(safe-area-inset-top))}
.bottom{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap}
.brand b{font:700 16px/1 var(--f-brand)} .brand b span{display:block;font:500 9px/1.7 var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font:500 11px var(--f-mono);padding:5px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--mute);white-space:nowrap;backdrop-filter:blur(8px)}
.chip b{color:var(--ink);font-weight:500}
.chip.hot{color:var(--a);border-color:rgba(61,245,166,.4)}
.feed{position:fixed;left:max(18px,env(safe-area-inset-left));top:calc(64px + env(safe-area-inset-top));display:grid;gap:4px;z-index:2;pointer-events:none;transition:opacity .6s}
.feed div{font:500 11px var(--f-mono);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px;width:max-content;animation:feedIn .35s cubic-bezier(.2,.8,.2,1),feedOut .6s 3.4s forwards}
.feed div i{font-style:normal;color:var(--a);margin-right:6px}
@keyframes feedIn{from{opacity:0;transform:translateX(-8px)}}
@keyframes feedOut{to{opacity:0;transform:translateX(-6px)}}
.panel{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;backdrop-filter:blur(10px)}
.panel label{display:flex;align-items:center;gap:8px;font:11px var(--f-mono);color:var(--mute)}
.panel input{accent-color:var(--a);width:96px}
.btn{font:600 12.5px var(--f-ui);background:var(--raise);color:var(--ink);border:1px solid var(--line2);border-radius:8px;height:30px;padding:0 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--a)}
.meters{display:flex;gap:3px;align-items:end;height:22px}
.meters i{width:5px;border-radius:2px;background:var(--a);opacity:.85;height:2px;transition:height .05s}
.start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,6,7,.66);backdrop-filter:blur(8px);z-index:5;padding:16px}
.card{background:#0f1115;border:1px solid var(--line2);border-radius:18px;padding:22px;max-width:540px;width:100%;display:grid;gap:10px}
.card h1{font:700 19px/1.2 var(--f-brand);margin:0}
.card p{margin:0 0 4px;color:var(--mute);font-size:13.5px}
.src{display:grid;grid-template-columns:34px 1fr;gap:2px 12px;align-items:center;text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);cursor:pointer;font:inherit}
.src:hover{border-color:var(--a)}
.src i{grid-row:span 2;font-style:normal;font-size:20px;text-align:center}
.src b{font-weight:600}.src small{color:var(--mute);font-size:12px;line-height:1.4}
.src.demo{border-style:dashed}
.err{color:#ff7a8a;font-size:13px;min-height:1em}
.hint{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);font:12.5px var(--f-ui);color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:92vw;text-align:center;z-index:2}
body.idle .hud,body.idle .feed{opacity:0}
body.zen .hud,body.zen .feed{opacity:0!important;pointer-events:none}
@media (max-width:640px){.panel label span.l{display:none}.panel input{width:70px}.chips .chip.opt{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud top">
  <div class="brand"><b>Danta<span>live</span></b></div>
  <div class="chips">
    <span class="chip" id="c-src">en attente</span>
    <span class="chip" id="c-sec">—</span>
    <span class="chip opt" id="c-bpm">— BPM</span>
    <span class="chip opt" id="c-note">—</span>
  </div>
</div>
<div class="feed" id="feed"></div>

<div class="hud bottom">
  <div class="panel">
    <label for="gain"><span class="l">Sensibilité</span><input id="gain" type="range" min="0.4" max="2.5" step="0.05" value="1"></label>
    <label for="bassk"><span class="l">Basses</span><input id="bassk" type="range" min="0.5" max="3" step="0.05" value="1.6"></label>
    <label for="react"><span class="l">Intensité visuelle</span><input id="react" type="range" min="0.4" max="2" step="0.05" value="1"></label>
    <div class="meters" id="meters" aria-hidden="true"></div>
  </div>
  <span style="flex:1"></span>
  <button class="btn" id="change">Source</button>
  <button class="btn" id="zen" title="Masquer l'interface (touche H)">Épuré</button>
  <button class="btn" id="fs" title="Plein écran (touche F)">Plein écran</button>
</div>
<div class="hint" id="hint" hidden></div>

<div class="start" id="start">
  <div class="card">
    <h1>Brancher le son</h1>
    <p>Danta live écoute la musique et la transforme en matière vivante : chaque coup, chaque basse, chaque voix et chaque changement de partie la fait réagir. Le son est analysé dans cette page, rien n'est enregistré ni envoyé.</p>
    <button class="src" data-src="tab"><i>🎧</i><b>Onglet Spotify (Chrome)</b><small>Ouvre open.spotify.com dans un onglet, choisis-le et coche « Partager aussi l'audio de l'onglet ». Le plus fidèle.</small></button>
    <button class="src" data-src="screen"><i>🖥️</i><b>Son du Mac (app Spotify)</b><small>Choisis « Écran entier » et active « Partager l'audio du système » (macOS et Chrome récents).</small></button>
    <button class="src" data-src="mic"><i>🎙️</i><b>Micro</b><small>Écoute ce qui sort des enceintes : marche partout, même pour l'iPhone, mais capte aussi la pièce.</small></button>
    <button class="src demo" data-src="demo"><i>✨</i><b>Démo</b><small>Un morceau généré ici (intro, couplet, montée, drop, break) pour voir Danta live réagir sans rien partager.</small></button>
    <div class="err" id="err"></div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const TAU = Math.PI*2, clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x)), lerp = (a,b,t) => a + (b-a)*t;
const NOTES = ["do","do♯","ré","ré♯","mi","fa","fa♯","sol","sol♯","la","la♯","si"];
const UI = { gain:1, react:1, bass:1.6 };
$("#bassk").addEventListener("input", e => UI.bass = +e.target.value);
$("#gain").addEventListener("input", e => UI.gain = +e.target.value);
$("#react").addEventListener("input", e => UI.react = +e.target.value);

/* =====================================================================
   1. ENTRÉE AUDIO
   ===================================================================== */
let AC = null, analyser = null, stream = null, demo = null, srcKind = null;
const FFT = 4096;
let fbuf, tbuf, hz;

async function connect(kind){
  $("#err").textContent = "";
  stopAll();
  // créé pendant le clic : sinon Chrome démarre le module audio en pause (= silence)
  AC = new (window.AudioContext || window.webkitAudioContext)();
  AC.resume().catch(()=>{});
  const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
  try {
    let node;
    if (kind === "demo"){ demo = makeDemo(AC); node = demo.out; }
    else if (kind === "mic"){
      stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
      node = AC.createMediaStreamSource(stream);
    } else {
      if (isSafari) throw new Error("Safari ne sait pas partager le son d'un onglet ou de l'écran : ouvre cette page dans Google Chrome, ou choisis « Micro ».");
      if (!navigator.mediaDevices?.getDisplayMedia) throw new Error("Ce navigateur ne permet pas de partager le son : utilise Google Chrome, ou choisis « Micro ».");
      const opts = { video:true, audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false },
        selfBrowserSurface:"exclude", systemAudio:"include", surfaceSwitching:"include", monitorTypeSurfaces: kind==="screen" ? "include" : "exclude" };
      try { stream = await navigator.mediaDevices.getDisplayMedia(opts); }
      catch(e){ if (e.name === "TypeError") stream = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true }); else throw e; }
      stream.getVideoTracks().forEach(t => t.stop());
      if (!stream.getAudioTracks().length) throw new Error(kind==="tab" ? "Aucun son reçu : coche « Partager aussi l'audio de l'onglet »." : "Aucun son reçu : active « Partager l'audio du système », ou utilise l'onglet Spotify / le micro.");
      node = AC.createMediaStreamSource(stream);
      stream.getAudioTracks()[0].addEventListener("ended", () => { stopAll(); $("#start").hidden = false; });
    }
    if (AC.state !== "running") await AC.resume().catch(()=>{});
    analyser = AC.createAnalyser(); analyser.fftSize = FFT; analyser.smoothingTimeConstant = 0;
    analyser.minDecibels = -100; analyser.maxDecibels = -10;
    node.connect(analyser);
    fbuf = new Float32Array(analyser.frequencyBinCount); tbuf = new Float32Array(FFT); hz = AC.sampleRate / FFT;
    srcKind = kind; resetAnalysis();
    $("#start").hidden = true;
    $("#c-src").innerHTML = `<b>${{ demo:"démo", mic:"micro", tab:"onglet", screen:"son du Mac" }[kind]}</b> · à l'écoute`; $("#c-src").classList.add("hot");
    pushFeed("●", "son branché");
  } catch(e){
    stopAll();
    $("#err").textContent = e.name === "NotAllowedError" ? (kind === "mic" ? "Accès au micro refusé : autorise-le dans la barre d'adresse (icône 🎙️), puis réessaie." : "Partage refusé. Réessaie et accepte la demande du navigateur.")
      : e.name === "NotFoundError" ? "Aucun micro trouvé." : (e.message || String(e));
  }
}
function stopAll(){
  if (demo){ demo.stop(); demo = null; }
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
  if (AC) AC.close().catch(()=>{}); AC = null; analyser = null; srcKind = null;
  $("#c-src").textContent = "en attente"; $("#c-src").classList.remove("hot");
}
document.querySelectorAll(".src").forEach(b => b.addEventListener("click", () => connect(b.dataset.src)));
$("#change").addEventListener("click", () => { stopAll(); $("#start").hidden = false; });

/* =====================================================================
   2. ANALYSE — 8 bandes, attaques adaptatives, tempo, harmonie, parties
   ===================================================================== */
const BANDS = [ // nom, de, à (Hz)
  ["sub",20,60],["kick",50,130],["basse",130,280],["bas-médium",280,800],["voix",800,2500],["présence",2500,5500],["charleston",6000,12000],["air",12000,16500]];
const NB = BANDS.length;
const F = {
  e:new Float32Array(NB), n:new Float32Array(NB), prev:new Float32Array(NB), max:new Float32Array(NB).fill(.05),
  fluxM:new Float32Array(NB), fluxV:new Float32Array(NB),
  rms:0, loudF:-60, loudS:-60, loudMax:-30, energy:0, bright:.5, flat:.3, tonal:0,
  chroma:new Float32Array(12), hue:150, pc:-1, pcStrength:0, voice:0,
  kick:0, snare:0, hat:0, bassHit:0,   // enveloppes d'attaque (0..1, décroissent)
  lastK:0, lastS:0, lastH:0, lastB:0, lastSub:0, low:0, lowAvg:0, lowPush:0,
  section:"calme", sectionSince:0, bpm:0, beatPhase:0, lastBeatT:0,
  history:[], profile:[], novelty:0, lastMoment:0, silentSince:0,
  onsetEnv:new Float32Array(480), oi:0
};
function resetAnalysis(){ F.max.fill(.05); F.fluxM.fill(0); F.fluxV.fill(0); F.history = []; F.profile = []; F.loudS = -60; F.loudMax = -30; F.lastMoment = performance.now(); F.onsetEnv.fill(0); }

function analyse(now, dt){
  if (!analyser){ decayAll(dt); return; }
  if (AC.state === "suspended") AC.resume().catch(()=>{});
  analyser.getFloatFrequencyData(fbuf); analyser.getFloatTimeDomainData(tbuf);
  const g = UI.gain;
  // --- niveau global (RMS → dB), moyennes rapide et lente
  let s = 0; for (let i = 0; i < tbuf.length; i += 2) s += tbuf[i]*tbuf[i];
  const rms = Math.sqrt(s / (tbuf.length/2)) * g, db = 20*Math.log10(rms + 1e-6);
  F.rms = rms;
  F.loudF += (db - F.loudF) * (1 - Math.exp(-dt/0.18));
  F.loudS += (db - F.loudS) * (1 - Math.exp(-dt/6));
  F.loudMax = Math.max(F.loudF, F.loudMax - dt*0.8);
  // --- bandes (magnitudes linéaires), normalisation auto (AGC) et flux
  const mag = i => Math.pow(10, fbuf[i]/20);
  let num = 0, den = 0, logSum = 0, linSum = 0, cnt = 0;
  for (let b = 0; b < NB; b++){
    const [ , f0, f1] = BANDS[b], i0 = Math.max(1, Math.floor(f0/hz)), i1 = Math.min(fbuf.length-1, Math.ceil(f1/hz));
    let e = 0; for (let i = i0; i <= i1; i++){ const m = mag(i); e += m*m; }
    e = Math.sqrt(e / (i1-i0+1)) * g * 60;
    const v = Math.log1p(e*4);                                          // compression perceptive
    F.max[b] = Math.max(v, F.max[b] * Math.exp(-dt/8), .04);            // gain automatique sur ~8 s
    const nv = clamp(v / F.max[b]);
    const flux = Math.max(0, nv - F.n[b]);
    F.fluxM[b] += (flux - F.fluxM[b]) * (1 - Math.exp(-dt/0.9));
    F.fluxV[b] += ((flux - F.fluxM[b])**2 - F.fluxV[b]) * (1 - Math.exp(-dt/0.9));
    F.prev[b] = F.n[b]; F.n[b] = F.n[b] + (nv - F.n[b]) * (nv > F.n[b] ? .65 : .18); F.e[b] = flux;
  }
  // brillance (centroïde), planéité (bruit vs note), chroma (notes jouées)
  F.chroma.fill(F.chroma[0] ? 0 : 0);
  const chromaNow = new Float32Array(12);
  for (let i = Math.floor(70/hz); i < Math.floor(9000/hz); i++){
    const m = mag(i), f = i*hz; num += f*m; den += m;
    if (f > 200 && f < 8000){ logSum += Math.log(m + 1e-9); linSum += m; cnt++; }
    if (f > 80 && f < 2000){ const note = Math.round(12*Math.log2(f/440)) + 69; chromaNow[((note % 12)+12)%12] += m*m; }
  }
  const centroid = den ? num/den : 500;
  F.bright += (clamp(Math.log(centroid/250)/Math.log(6000/250)) - F.bright) * .08;
  const flat = cnt ? Math.exp(logSum/cnt) / (linSum/cnt + 1e-9) : .3;
  F.flat += (clamp(flat*3) - F.flat) * .1;
  let cs = 0, cmax = 0, cpc = 0;
  for (let k = 0; k < 12; k++){ F.chroma[k] = lerp(F.chroma[k] || 0, chromaNow[k], .12); cs += F.chroma[k]; if (F.chroma[k] > cmax){ cmax = F.chroma[k]; cpc = k; } }
  F.pcStrength = cs ? cmax/cs : 0; F.tonal = clamp((F.pcStrength - .1) * 4);
  if (F.pcStrength > .14 && cpc !== F.pc && F.energy > .12){ F.pc = cpc; }
  // teinte : la note dominante choisit la couleur (cycle des quintes = couleurs voisines pour accords voisins)
  const targetHue = F.pc >= 0 ? ((F.pc*7) % 12) * 30 + 140 : 150;
  let dh = ((targetHue - F.hue + 540) % 360) - 180; F.hue = (F.hue + dh * clamp(dt*.8)) % 360;
  // voix : médiums tonals et soutenus
  F.voice += (clamp((F.n[4]*.7 + F.n[3]*.3) * (1 - F.flat) * 1.6 - .25) - F.voice) * .06;
  // --- attaques : seuil adaptatif (moyenne + k·écart-type) et période réfractaire
  const onset = (b, k, minGap, lastKey) => {
    const thr = F.fluxM[b] + k*Math.sqrt(F.fluxV[b]) + .03;
    if (F.e[b] > thr && now - F[lastKey] > minGap){ F[lastKey] = now; return clamp((F.e[b] - thr) * 5 + .45, .3, 1.3); }
    return 0;
  };
  const kv = Math.max(onset(1, 1.5, 150, "lastK"), 0);
  const sv = (() => { const b = F.e[4]*.4 + F.e[5]*.6, thr = (F.fluxM[4]*.4 + F.fluxM[5]*.6) + 1.6*Math.sqrt(F.fluxV[5]) + .03;
    if (b > thr && now - F.lastS > 140 && F.flat > .2){ F.lastS = now; return clamp((b-thr)*5 + .45, .3, 1.3); } return 0; })();
  const hv = onset(6, 1.3, 70, "lastH");
  const bv = Math.max(onset(2, 1.5, 200, "lastB"), onset(0, 1.4, 200, "lastSub"));
  // enveloppe des basses : attaque immédiate, relâche courte, normalisée sur le morceau
  const lowNow = Math.max(F.n[0], F.n[1]*.95, F.n[2]*.85);
  F.low = lowNow > F.low ? lowNow : F.low + (lowNow - F.low)*(1 - Math.exp(-dt/0.12));
  F.lowAvg += (F.low - F.lowAvg)*(1 - Math.exp(-dt/3));
  F.lowPush = clamp((F.low - F.lowAvg*.8) * 2.2);        // ce qui dépasse la moyenne = la poussée ressentie
  F.kick = Math.max(F.kick * Math.exp(-dt/0.11), kv); F.snare = Math.max(F.snare * Math.exp(-dt/0.09), sv);
  F.hat = Math.max(F.hat * Math.exp(-dt/0.05), hv); F.bassHit = Math.max(F.bassHit * Math.exp(-dt/0.35), bv);
  if (kv) EV.emit("kick", kv); if (sv) EV.emit("snare", sv); if (hv) EV.emit("hat", hv); if (bv) EV.emit("bass", bv);
  // --- énergie globale
  const inten = clamp((F.loudF + 52) / 40);
  F.energy += ((inten*.5 + (F.n[1]+F.n[2])*.25 + (F.n[4]+F.n[5])*.12 + F.n[6]*.08) - F.energy) * (1 - Math.exp(-dt/0.15));
  // --- tempo : autocorrélation de l'enveloppe des attaques (~8 s)
  F.fps = F.fps ? lerp(F.fps, 1/Math.max(dt,.004), .02) : 60;
  F.onsetEnv[F.oi++ % F.onsetEnv.length] = kv*1 + sv*.7 + hv*.15;
  if ((F.oi % 60) === 0) estimateTempo(dt);
  // --- parties du morceau + moments de nouveauté
  sections(now, db);
  novelty(now);
}
function decayAll(dt){ for (let b = 0; b < NB; b++) F.n[b] *= .92; F.energy *= .95; F.low *= .9; F.lowPush *= .9; F.kick *= .9; F.snare *= .9; F.hat *= .85; F.voice *= .95; }

function estimateTempo(){
  const N = F.onsetEnv.length, env = new Float32Array(N), start = F.oi % N;
  for (let i = 0; i < N; i++) env[i] = F.onsetEnv[(start + i) % N];
  const fps = F.fps || 60; let best = 0, bestLag = 0;
  for (let bpm = 70; bpm <= 180; bpm += 1){
    const lag = fps*60/bpm; let acc = 0;
    for (let i = Math.ceil(lag); i < N; i++){ const j = i - lag, j0 = Math.floor(j), w = j - j0; acc += env[i] * (env[j0]*(1-w) + env[j0+1]*w); }
    acc *= 1 + .25*Math.exp(-(((bpm-100)/35)**2));                     // légère préférence pour 85–125 BPM
    if (acc > best){ best = acc; bestLag = bpm; }
  }
  if (best > .4){ F.bpm = F.bpm ? lerp(F.bpm, bestLag, Math.abs(F.bpm - bestLag) > 12 ? .5 : .2) : bestLag; }
}
function setSection(name, now){
  if (F.section === name) return;
  const prev = F.section; F.section = name; F.sectionSince = now;
  EV.emit("section", { name, prev });
}
function sections(now, db){
  // historique 0,25 s pour lire la tendance (montée / chute)
  if (!F.history.length || now - F.history.at(-1).t > 250){ F.history.push({ t:now, l:F.loudF, h:F.n[6], s:F.n[5] }); if (F.history.length > 40) F.history.shift(); }
  const H = F.history; if (H.length < 12) return;
  const recent = H.slice(-8), older = H.slice(-24, -8);
  const avg = (a,k) => a.reduce((x,y) => x + y[k], 0) / a.length;
  const slope = avg(recent,"l") - avg(older,"l"), hiRise = (avg(recent,"h") + avg(recent,"s")) - (avg(older,"h") + avg(older,"s"));
  const since = now - F.sectionSince;
  if (db < -58){ if (!F.silentSince) F.silentSince = now; if (now - F.silentSince > 900) setSection("silence", now); return; }
  F.silentSince = 0;
  if ((F.section === "montée" || F.section === "break" || F.section === "silence") && F.loudF > F.loudS + 4 && F.kick > .5) { setSection("drop", now); return; }
  if (slope > 2.2 && hiRise > .1 && since > 1500 && F.section !== "drop") { setSection("montée", now); return; }
  if (F.loudF < F.loudS - 6 && since > 1500) { setSection("break", now); return; }
  if (F.section === "drop" && since > 9000) setSection("refrain", now);
  else if ((F.section === "silence") || (F.section === "break" && F.loudF > F.loudS - 2 && since > 2500) || (F.section === "montée" && since > 9000)) setSection(F.energy > .55 ? "refrain" : "couplet", now);
  else if ((F.section === "calme" || F.section === "couplet" || F.section === "refrain") && since > 4000) setSection(F.energy > .6 ? "refrain" : F.energy > .25 ? "couplet" : "calme", now);
}
function novelty(now){
  // profil spectral sur 0,5 s comparé aux 4 s précédentes : un changement de texture = un « moment »
  if (!F._acc){ F._acc = new Float32Array(NB); F._cnt = 0; F._t = now; }
  for (let b = 0; b < NB; b++) F._acc[b] += F.n[b]; F._cnt++;
  if (now - F._t < 500) return;
  const p = Array.from(F._acc, x => x / F._cnt); F._acc.fill(0); F._cnt = 0; F._t = now;
  F.profile.push(p); if (F.profile.length > 9) F.profile.shift();
  if (F.profile.length < 9) return;
  const ref = new Array(NB).fill(0); F.profile.slice(0, 8).forEach(q => q.forEach((x,i) => ref[i] += x/8));
  let dot = 0, a = 0, b = 0; for (let i = 0; i < NB; i++){ dot += p[i]*ref[i]; a += p[i]*p[i]; b += ref[i]*ref[i]; }
  const dist = 1 - dot / (Math.sqrt(a*b) + 1e-9);
  F.novelty = lerp(F.novelty, dist, .5);
  if (dist > .035 && now - F.lastMoment > 2200 && F.energy > .08){ F.lastMoment = now; EV.emit("moment", clamp(dist*12, .3, 1)); }
  // filet : au moins une petite mutation toutes les ~7 s quand ça joue
  else if (now - F.lastMoment > 7000 && F.energy > .2){ F.lastMoment = now; EV.emit("moment", .3); }
}

/* bus d'évènements */
const EV = { h:{}, on(t,f){ (this.h[t] ||= []).push(f); }, emit(t,v){ (this.h[t] || []).forEach(f => f(v)); } };

/* =====================================================================
   3. VISUEL — membrane ondulante, échos, gouttes liquides, poussière, mutations
   ===================================================================== */
const cv = $("#c"), ctx = cv.getContext("2d");
let W = 0, Hh = 0, CX = 0, CY = 0, R = 0, DPR = 1;
function resize(){ DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; Hh = innerHeight; cv.width = W*DPR; cv.height = Hh*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); CX = W/2; CY = Hh/2; R = Math.min(W, Hh) * .2; ctx.fillStyle = "#050607"; ctx.fillRect(0,0,W,Hh); }
addEventListener("resize", resize); resize();

const M = 180;                                    // points de la membrane
const mem = { d:new Float32Array(M), v:new Float32Array(M), f:new Float32Array(M), rot:0, rotV:.15, k:3, kT:3, kMix:1, lobe:0, punch:0, tight:0, calm:0, flash:0, hueShift:0, twist:0, layersPhase:0 };
const echoes = [], drops = [], sparks = [], bassRings = [];
const cam = { kick:0, bass:0, sx:0, sy:0 };
const dust = Array.from({length:420}, () => ({ a:Math.random()*TAU, r:Math.random(), z:Math.random(), v:0, life:Math.random() }));
const col = (h, s, l, a=1) => `hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;

function impulse(angle, amp, width){             // coup sur la membrane, qui se propage ensuite en ondes
  const c = Math.round(((angle % TAU + TAU) % TAU) / TAU * M);
  for (let j = -width; j <= width; j++){ const i = (c + j + M) % M, w = Math.exp(-(j*j)/(2*(width/2.5)**2)); mem.v[i] += amp*w; }
}
function radiusAt(i){
  const th = i/M*TAU, k = mem.k, lobe = mem.lobe * Math.cos(k*(th + mem.rot*.3)) * (1 - mem.calm*.7);
  const B = UI.bass;
  return R*(.9 + .16*F.low*B + .38*F.lowPush*B + .1*F.n[0]*B - .12*mem.tight + .2*mem.punch*B) * (1 + lobe*.3) + mem.d[i]*R*(1 + .4*F.lowPush*B);
}
function shape(scale=1, rotOff=0){
  const pts = new Array(M);
  for (let i = 0; i < M; i++){ const th = i/M*TAU + mem.rot + rotOff, r = radiusAt(i)*scale; pts[i] = [CX + Math.cos(th)*r, CY + Math.sin(th)*r]; }
  return pts;
}
function pathOf(pts){
  ctx.beginPath();
  const n = pts.length, mid = (a,b) => [(a[0]+b[0])/2, (a[1]+b[1])/2];
  let m0 = mid(pts[n-1], pts[0]); ctx.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++){ const p = pts[i], m = mid(p, pts[(i+1)%n]); ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]); }
  ctx.closePath();
}

/* réactions aux évènements */
EV.on("kick", v => {
  const a = Math.random()*TAU, R2 = UI.react;
  const B = UI.bass;
  for (let j = 0; j < Math.max(2, Math.round(mem.k)); j++) impulse(a + j*TAU/Math.max(2, Math.round(mem.k)), .08*v*R2*B, 12);
  mem.punch = Math.max(mem.punch, .7*v);
  cam.kick = Math.max(cam.kick, v*B);
  cam.sx += (Math.random()-.5)*10*v*B; cam.sy += (Math.random()-.5)*10*v*B;
  echoes.push({ pts: shape(1.02), s:1, a:.6*v, w:3 + 7*v*B, hue:F.hue });
  if (echoes.length > 14) echoes.shift();
  dust.forEach(p => p.v += .004*v*(1 - p.r));
});
EV.on("snare", v => {
  const n = 2 + Math.floor(v*4);
  for (let j = 0; j < n; j++) impulse(Math.random()*TAU, -.06*v*UI.react, 4);
  const count = 2 + Math.floor(v*5);
  for (let j = 0; j < count; j++) spawnDrop(Math.floor(Math.random()*M), (.55 + .5*Math.random())*v);
  for (let j = 0; j < 10*v; j++) sparks.push({ a:Math.random()*TAU, r:1.05, v:.01 + .02*Math.random()*v, life:1, hue:F.hue + 40 });
});
EV.on("hat", v => { for (let j = 0; j < 3; j++) impulse(Math.random()*TAU, .012*v*UI.react*(Math.random() < .5 ? 1 : -1), 2); });
EV.on("bass", v => {
  const B = UI.bass;
  mem.lobe = Math.min(1.6, mem.lobe + .5*v*B);
  for (let i = 0; i < M; i++) mem.v[i] += .05*v*B*Math.cos(i/M*TAU*2 + mem.rot);  // toute la membrane pousse d'un bloc
  cam.bass = Math.max(cam.bass, v*B);
  bassRings.push({ r:1, a:.55*v, hue:F.hue - 30 });
  if (bassRings.length > 8) bassRings.shift();
});
EV.on("moment", v => {
  // mutation : nouvelle symétrie, sens de rotation, décalage de couleur, torsion
  const choices = [2,3,4,5,6,7,8].filter(x => x !== mem.kT);
  mem.kT = choices[Math.floor(Math.random()*choices.length)];
  if (Math.random() < .5) mem.rotV *= -1;
  mem.hueShift += (Math.random() < .5 ? 1 : -1) * (30 + 60*v);
  mem.twist = (Math.random()-.5) * 2 * v;
  mem.flash = Math.max(mem.flash, .25*v);
  echoes.push({ pts: shape(1.05), s:1, a:.7, w:6, hue:F.hue + mem.hueShift });
  pushFeed("✦", `nouvelle texture · ${mem.kT} branches`);
});
EV.on("section", ({name, prev}) => {
  $("#c-sec").innerHTML = `<b>${name}</b>`;
  if (name === "drop"){
    mem.flash = 1; mem.punch = 1.2; mem.tight = 0;
    for (let i = 0; i < M; i += 3) impulse(i/M*TAU, .12*UI.react, 6);
    for (let j = 0; j < 30; j++) spawnDrop(Math.floor(Math.random()*M), .8 + .7*Math.random());
    for (let j = 0; j < 140; j++) sparks.push({ a:Math.random()*TAU, r:1, v:.02 + .05*Math.random(), life:1, hue:F.hue + Math.random()*90 });
    dust.forEach(p => p.v += .05 + .05*Math.random());
    EV.emit("moment", 1);
  }
  pushFeed(name === "drop" ? "💥" : name === "montée" ? "↗" : name === "break" ? "◌" : "•", name === "drop" ? "DROP" : `partie : ${name}`);
});

function spawnDrop(i, power){
  if (drops.length > 90) drops.shift();
  drops.push({ i, h:0, v:power * R * .045 * UI.react, life:1, neck:1, size: .7 + .6*Math.random(), hue: F.hue + (Math.random()-.5)*40 });
}

/* boucle de dessin */
let last = performance.now(), frames = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last)/1000); last = now; frames++;
  try { analyse(now, dt); } catch(e){ console.warn(e); }
  step(dt, now); draw(now);
  hud(now);
}
function step(dt, now){
  // membrane : équation d'onde sur l'anneau + rappel + amortissement + forçage par le spectre
  const c2 = 28 + 40*F.n[6], k = 16 + 30*mem.tight, damp = 3.2 + 4*mem.calm, tension = F.section === "break" ? .4 : 1;
  for (let i = 0; i < M; i++){
    const th = i/M*TAU, sym = Math.abs(Math.cos((th + mem.twist*Math.sin(now/1300)) * mem.k / 2));
    // spectre enroulé : basses en bas, aigus en haut, en miroir
    const pos = (Math.sin(th) + 1)/2, b = clamp(Math.floor((1 - pos) * (NB - 1) + .5), 0, NB - 1);
    mem.f[i] = (F.n[b] * .05 + F.n[(b+1)%NB]*.02) * (.6 + .8*sym) * UI.react * tension;
  }
  for (let i = 0; i < M; i++){
    const l = mem.d[(i-1+M)%M], r = mem.d[(i+1)%M];
    const a = c2*(l + r - 2*mem.d[i]) - k*mem.d[i] + (mem.f[i] - mem.d[i])*6 - damp*mem.v[i];
    mem.v[i] += a*dt;
  }
  // lissage : coupe les dents de scie (modes trop aigus) pour garder une matière liquide
  const vv = Float32Array.from(mem.v);
  for (let i = 0; i < M; i++) mem.v[i] = vv[i]*.5 + (vv[(i-1+M)%M] + vv[(i+1)%M])*.25;
  for (let i = 0; i < M; i++){ mem.d[i] += mem.v[i]*dt*8; mem.d[i] = clamp(mem.d[i], -.45, .7); }
  // symétrie qui se transforme en douceur
  mem.k = lerp(mem.k, mem.kT, clamp(dt*1.6));
  // rotation : plus rapide en montée, ralentie en break
  const target = (F.section === "montée" ? 1.4 : F.section === "break" ? .08 : F.section === "drop" ? .9 : .25 + .5*F.energy) * Math.sign(mem.rotV || 1);
  mem.rotV = lerp(mem.rotV, target, clamp(dt*1.2)); mem.rot += mem.rotV*dt;
  mem.lobe *= Math.exp(-dt/0.6); mem.punch *= Math.exp(-dt/0.25); mem.flash *= Math.exp(-dt/0.35);
  mem.tight = lerp(mem.tight, F.section === "montée" ? clamp((now - F.sectionSince)/6000) : 0, clamp(dt*2));
  mem.calm = lerp(mem.calm, F.section === "break" || F.section === "calme" || F.section === "silence" ? 1 : 0, clamp(dt*.8));
  mem.twist *= Math.exp(-dt/6);
  cam.kick *= Math.exp(-dt/0.12); cam.bass *= Math.exp(-dt/0.4); cam.sx *= Math.exp(-dt/0.06); cam.sy *= Math.exp(-dt/0.06);
  for (const b of bassRings){ b.r += dt*(1.2 + 1.5*F.low); b.a *= Math.exp(-dt/0.7); }
  for (let i = bassRings.length - 1; i >= 0; i--) if (bassRings[i].a < .02) bassRings.splice(i, 1);
  // gouttes : lancées vers l'extérieur, rappelées vers la membrane (gravité radiale)
  for (const d of drops){ d.v -= R*.0016*(1 + F.energy) ; d.h += d.v; if (d.h <= 0){ d.h = 0; d.v = Math.abs(d.v) > R*.006 ? -d.v*.35 : 0; d.life -= .5*dt; } if (d.h > R*.04) d.neck = Math.max(0, d.neck - dt*6); else d.neck = Math.min(1, d.neck + dt*3); d.life -= dt*.15; }
  for (let i = drops.length - 1; i >= 0; i--) if (drops[i].life <= 0 || (drops[i].h === 0 && drops[i].v === 0 && drops[i].life < .9)) drops.splice(i, 1);
  for (const s of sparks){ s.r += s.v; s.v *= .975; s.life -= dt*.9; }
  for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].life <= 0) sparks.splice(i, 1);
  if (sparks.length > 600) sparks.splice(0, sparks.length - 600);
  // poussière : orbite, aspirée en montée, soufflée sur les coups
  const inhale = F.section === "montée" ? .0025 : 0;
  for (const p of dust){ p.a += dt*(.05 + .4*F.energy + (F.section === "montée" ? .6 : 0))*(p.z*.6 + .4)*Math.sign(mem.rotV || 1); p.r += p.v - inhale + .006*F.lowPush*UI.bass*(1 - p.z*.5); p.v *= .93; p.r += (.55 + p.z*.45 - p.r)*.004; if (p.r < .05) p.r = .9; }
  for (const e of echoes){ e.s += dt*(.6 + 1.4*F.energy); e.a *= Math.exp(-dt/0.55); }
  for (let i = echoes.length - 1; i >= 0; i--) if (echoes[i].a < .02) echoes.splice(i, 1);
}
function draw(now){
  const hue = F.hue + mem.hueShift, sat = 70 + 25*(1 - mem.calm), e = F.energy;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // traînées : plus longues quand ça s'emballe
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = `rgba(5,6,7,${.16 + .22*(1 - e) + .2*mem.calm})`; ctx.fillRect(0,0,W,Hh);
  // halo de fond coloré par l'harmonie
  const bg = ctx.createRadialGradient(CX, CY, R*.2, CX, CY, Math.max(W,Hh)*.7);
  bg.addColorStop(0, col(hue, sat, 12 + 18*e + 26*F.lowPush*UI.bass + 30*mem.flash, .35 + .3*F.lowPush)); bg.addColorStop(1, "rgba(5,6,7,0)");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,Hh);
  // caméra : zoom sur chaque kick, secousse, respiration de la basse
  const z = 1 + .05*cam.kick + .03*cam.bass + .04*F.lowPush*UI.bass;
  ctx.setTransform(DPR*z, 0, 0, DPR*z, DPR*(CX*(1 - z) + cam.sx), DPR*(CY*(1 - z) + cam.sy));
  // anneaux de basse : vagues lourdes et larges qui partent du centre
  ctx.globalCompositeOperation = "lighter";
  for (const b of bassRings){ const rr = R*(.9 + b.r*1.3), g2 = ctx.createRadialGradient(CX, CY, rr*.75, CX, CY, rr);
    g2.addColorStop(0, "rgba(0,0,0,0)"); g2.addColorStop(.85, col(b.hue, 90, 45, b.a*.5)); g2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(CX, CY, rr, 0, TAU); ctx.fill(); }
  ctx.globalCompositeOperation = "source-over";

  ctx.globalCompositeOperation = "lighter";
  // poussière
  const dustR = Math.max(W,Hh)*.6;
  for (const p of dust){ const r = R*1.2 + p.r*dustR, x = CX + Math.cos(p.a)*r, y = CY + Math.sin(p.a)*r*.92;
    const a = (.15 + .5*F.n[6]*p.z + .3*mem.flash) * (1 - p.r*.6);
    ctx.fillStyle = col(hue + p.z*60, 80, 70, a); ctx.fillRect(x, y, 1 + p.z*1.6, 1 + p.z*1.6); }
  // échos (ondes de choc qui gardent la forme de la membrane)
  for (const ec of echoes){ ctx.save(); ctx.translate(CX, CY); ctx.scale(ec.s, ec.s); ctx.translate(-CX, -CY);
    pathOf(ec.pts); ctx.strokeStyle = col(ec.hue + 20, 90, 65, ec.a); ctx.lineWidth = ec.w/ec.s; ctx.stroke(); ctx.restore(); }
  // étincelles
  for (const s of sparks){ const r = R*(1.1 + s.r*2.2), x = CX + Math.cos(s.a)*r, y = CY + Math.sin(s.a)*r;
    ctx.fillStyle = col(s.hue, 95, 70, s.life*.8); ctx.beginPath(); ctx.arc(x, y, 1.2 + 1.5*s.life, 0, TAU); ctx.fill(); }

  // membrane : 3 couches (extérieure, intermédiaire décalée, cœur-voix)
  const outer = shape(1), mid = shape(.72, .35 + mem.twist*.5), inner = shape(.42 + .1*F.voice, -.5);
  ctx.globalCompositeOperation = "source-over";
  const gOut = ctx.createRadialGradient(CX, CY, R*.1, CX, CY, R*1.5);
  gOut.addColorStop(0, col(hue, sat, 55 + 15*e, .95)); gOut.addColorStop(.6, col(hue + 25, sat, 32 + 10*e, .9)); gOut.addColorStop(1, col(hue + 50, sat, 14, .85));
  pathOf(outer); ctx.fillStyle = gOut; ctx.fill();
  ctx.lineWidth = 1.5 + 3*F.n[5] + 4*F.snare; ctx.strokeStyle = col(hue - 20, 95, 72, .55 + .4*F.snare); ctx.stroke();
  ctx.globalCompositeOperation = "lighter";
  pathOf(mid); ctx.fillStyle = col(hue + 60, 90, 45, .18 + .25*F.n[3]); ctx.fill();
  ctx.lineWidth = 1 + 2*F.n[4]; ctx.strokeStyle = col(hue + 70, 95, 70, .25 + .4*F.n[4]); ctx.stroke();
  // cœur : la voix et la mélodie
  const gIn = ctx.createRadialGradient(CX, CY, 0, CX, CY, R*.6);
  gIn.addColorStop(0, col(hue + 140, 100, 85, .55 + .4*F.voice)); gIn.addColorStop(1, col(hue + 140, 100, 50, 0));
  pathOf(inner); ctx.fillStyle = gIn; ctx.fill();

  // gouttes liquides (l'ADN du logo) : col qui s'étire depuis la membrane
  ctx.globalCompositeOperation = "source-over";
  for (const d of drops){
    const th = d.i/M*TAU + mem.rot, rb = radiusAt(d.i), cos = Math.cos(th), sin = Math.sin(th);
    const base = [CX + cos*rb, CY + sin*rb], dist = rb + R*.06 + d.h, p = [CX + cos*dist, CY + sin*dist];
    const dr = R*(.035 + .02*F.energy)*d.size*(.4 + .6*d.life);
    if (d.neck > .02){ const nx = -sin, ny = cos, wb = dr*.7, wm = Math.max(.4, wb*.35*d.neck), m = [(base[0]+p[0])/2, (base[1]+p[1])/2];
      ctx.fillStyle = col(d.hue, 90, 60, .9*d.life); ctx.beginPath(); ctx.moveTo(base[0]+nx*wb, base[1]+ny*wb);
      ctx.quadraticCurveTo(m[0]+nx*wm, m[1]+ny*wm, p[0]+nx*dr*.8, p[1]+ny*dr*.8); ctx.lineTo(p[0]-nx*dr*.8, p[1]-ny*dr*.8);
      ctx.quadraticCurveTo(m[0]-nx*wm, m[1]-ny*wm, base[0]-nx*wb, base[1]-ny*wb); ctx.closePath(); ctx.fill(); }
    const g = ctx.createRadialGradient(p[0]-dr*.35, p[1]-dr*.35, dr*.1, p[0], p[1], dr);
    g.addColorStop(0, col(d.hue, 100, 92, d.life)); g.addColorStop(.45, col(d.hue, 90, 60, d.life)); g.addColorStop(1, col(d.hue + 30, 80, 22, d.life));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p[0], p[1], dr, 0, TAU); ctx.fill();
  }
  // éclair global sur les drops
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (mem.flash > .02){ ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = col(hue + 30, 100, 70, mem.flash*.18); ctx.fillRect(0,0,W,Hh); }
  ctx.globalCompositeOperation = "source-over";
}

/* =====================================================================
   4. INTERFACE

const meters = $("#meters"); meters.innerHTML = Array.from({length:NB}, () => "<i></i>").join("");
let hudT = 0;
function hud(now){
  if (now - hudT < 100) return; hudT = now;
  [...meters.children].forEach((m, b) => m.style.height = (2 + F.n[b]*20) + "px");
  $("#c-bpm").innerHTML = F.bpm ? `<b>${Math.round(F.bpm)}</b> BPM` : "— BPM";
  $("#c-note").innerHTML = F.pc >= 0 && F.tonal > .2 ? `note <b>${NOTES[F.pc]}</b>` : F.voice > .3 ? "<b>voix</b>" : "—";
  const silent = analyser && F.loudF < -58 && now - (F._heard || now) > 2500;
  if (F.loudF > -58) F._heard = now;
  const h = $("#hint"); h.hidden = !silent;
  if (silent) h.textContent = "Aucun son reçu. Vérifie que la musique joue et que le partage de l'audio est coché, ou monte la sensibilité.";
}
function pushFeed(icon, text){
  const f = $("#feed"), el = document.createElement("div"); el.innerHTML = `<i>${icon}</i>${text}`; f.prepend(el);
  while (f.children.length > 5) f.lastChild.remove(); setTimeout(() => el.remove(), 4200);
}
$("#fs").addEventListener("click", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(()=>{}));
$("#zen").addEventListener("click", () => document.body.classList.toggle("zen"));
addEventListener("keydown", e => { if (e.key === "f") $("#fs").click(); if (e.key === "h") $("#zen").click(); });
let idleT; const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => analyser && document.body.classList.add("idle"), 3500); };
["mousemove","keydown","touchstart"].forEach(ev => addEventListener(ev, wake)); wake();
requestAnimationFrame(frame);

/* =====================================================================
   5. DÉMO — un morceau généré ici (intro, couplet, montée, drop, break)
   ===================================================================== */
function makeDemo(ac){
  const out = ac.createGain(); out.gain.value = .55; out.connect(ac.destination);
  const comp = ac.createDynamicsCompressor(); comp.connect(out);
  const bpm = 94, spb = 60/bpm, s16 = spb/4, BAR = 16;
  const noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2 - 1;
  const chords = [[57,60,64],[53,57,60],[60,64,67],[55,59,62]];       // la m, fa, do, sol
  const mtof = m => 440*Math.pow(2, (m-69)/12);
  function kick(t, v=1){ const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t+.12);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t+.35); o.connect(g).connect(comp); o.start(t); o.stop(t+.4); }
  function snare(t, v=1){ const n = ac.createBufferSource(); n.buffer = noise; const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2200; f.Q.value = .7;
    const g = ac.createGain(); g.gain.setValueAtTime(.7*v, t); g.gain.exponentialRampToValueAtTime(.001, t+.18); n.connect(f).connect(g).connect(comp); n.start(t); n.stop(t+.2);
    const o = ac.createOscillator(), og = ac.createGain(); o.frequency.value = 190; og.gain.setValueAtTime(.35*v, t); og.gain.exponentialRampToValueAtTime(.001, t+.08); o.connect(og).connect(comp); o.start(t); o.stop(t+.1); }
  function hat(t, v=.3, open=false){ const n = ac.createBufferSource(); n.buffer = noise; const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 8000;
    const g = ac.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + (open ? .25 : .04)); n.connect(f).connect(g).connect(comp); n.start(t); n.stop(t+.3); }
  function bass(t, m, d, v=.5, slide){ const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(); o.type = "sawtooth"; f.type = "lowpass"; f.frequency.value = 420;
    o.frequency.setValueAtTime(mtof(m-24), t); if (slide) o.frequency.exponentialRampToValueAtTime(mtof(m-24+slide), t+d*.8);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.01); g.gain.setTargetAtTime(0, t+d*.85, .05); o.connect(f).connect(g).connect(comp); o.start(t); o.stop(t+d+.2); }
  function pad(t, notes, d, v=.08, cutoff=1800){ notes.forEach(m => [-.08,.08].forEach(det => { const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(); o.type = "sawtooth"; o.detune.value = det*100;
    f.type = "lowpass"; f.frequency.value = cutoff; o.frequency.value = mtof(m); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.4); g.gain.setTargetAtTime(0, t+d-.3, .2);
    o.connect(f).connect(g).connect(comp); o.start(t); o.stop(t+d+.6); })); }
  function lead(t, m, d, v=.12){ const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = mtof(m+12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.02); g.gain.setTargetAtTime(0, t+d*.8, .06); o.connect(g).connect(comp); o.start(t); o.stop(t+d+.3); }
  function riser(t, d){ const n = ac.createBufferSource(); n.buffer = noise; n.loop = true; const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 2;
    f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(9000, t+d); const g = ac.createGain(); g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.35, t+d);
    g.gain.setValueAtTime(0, t+d); n.connect(f).connect(g).connect(comp); n.start(t); n.stop(t+d+.05); }
  // 32 mesures : intro 0-3, couplet 4-11, montée 12-15, drop 16-23, break 24-27, retour 28-31
  const K1 = "x.....x...x.....", K2 = "x.....x..x..x...", KD = "x..x..x...x..x..", SN = "....x.......x...", HT = "x.x.x.x.x.x.x.x.", HD = "xxxxx2xxxxxx22xx";
  let next = ac.currentTime + .1, step = 0, timer = null, riserAt = -1;
  const mel = [69,72,76,74,72,69,67,69, 65,69,72,71,69,65,64,65];
  function schedule(){
    while (next < ac.currentTime + .25){
      const bar = Math.floor(step/BAR) % 32, i = step % BAR, t = next, ch = chords[Math.floor(bar/1) % 4];
      const part = bar < 4 ? "intro" : bar < 12 ? "verse" : bar < 16 ? "build" : bar < 24 ? "drop" : bar < 28 ? "break" : "verse";
      if (i === 0) pad(t, ch, spb*4, part === "break" ? .1 : part === "intro" ? .07 : .05, part === "break" ? 900 : part === "drop" ? 3200 : 1800);
      if (part !== "intro" && part !== "break"){
        const K = part === "drop" ? KD : (bar % 2 ? K2 : K1); if (K[i] === "x") kick(t, part === "drop" ? 1 : .85);
        if (part === "build"){ const density = 1 + (bar - 12); if (i % Math.max(1, 4 - density) === 0) snare(t, .4 + .15*(bar-12) + .2*(i/16)); }
        else if (SN[i] === "x" || (bar % 4 === 3 && i >= 13)) snare(t, i >= 13 ? .6 : 1);
        const H = part === "drop" ? HD : HT; if (H[i] === "x") hat(t, i % 4 === 0 ? .35 : .22, false); if (H[i] === "2"){ hat(t, .25); hat(t + s16/2, .2); }
        if (i % 4 === 0 || (part === "drop" && i % 4 === 3)) bass(t, ch[0], s16*(part === "drop" ? 3 : 4), part === "drop" ? .55 : .4, part === "drop" && i === 12 ? 5 : 0);
      } else if (part === "intro" && i % 2 === 0) hat(t, .12);
      if ((part === "verse" || part === "drop") && i % 2 === 0 && Math.random() < .55) lead(t, mel[(step/2) % 16 | 0], s16*2, part === "drop" ? .14 : .09);
      if (bar === 12 && i === 0 && riserAt !== Math.floor(step/BAR)){ riserAt = Math.floor(step/BAR); riser(t, spb*16); }
      next += s16 + (i % 2 ? .012 : -.012);                                         // léger swing
      step++;
    }
  }
  timer = setInterval(schedule, 40); schedule();
  return { out: comp, stop(){ clearInterval(timer); try { out.disconnect(); } catch {} } };
}
</script>
